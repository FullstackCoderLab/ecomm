# ==========================================
# Server Configuration
# ==========================================
server.port=8081

# ==========================================
# Application Configuration
# ==========================================
spring.application.name=eCommUserAuth

# ==========================================
# H2 In-Memory Database Configuration
# ==========================================
spring.datasource.url=jdbc:h2:file:C:/Users/NADEEM/test;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Web Console Configuration (Accessible at http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==========================================
# JWT (JSON Web Token) Security Configuration
# ==========================================
# 256-bit base64/hex secret key for HMAC-SHA256 signature
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiration time in milliseconds (86400000 ms = 24 hours)
app.jwt.expiration-ms=86400000

# ==========================================
# SpringDoc OpenAPI / Swagger UI Configuration
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ==========================================
# Logging Configuration
# ==========================================
logging.level.com.ecomm=DEBUG
logging.level.org.springframework.security=INFO

# ==========================================
# Eureka Client Configuration (Register with eCommAPIGateway)
# ==========================================
# Connect to eCommAPIGateway's Eureka Server running on default port 8761
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
