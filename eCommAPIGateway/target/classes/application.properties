# ==========================================
# Server Configuration
# ==========================================
# Default port 8761 for Eureka Service Registry & API Gateway
server.port=8761

# ==========================================
# Application Configuration
# ==========================================
spring.application.name=eCommAPIGateway

# ==========================================
# Eureka Server Configuration (Service Registry & Discovery)
# ==========================================
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# Gateway is the registry server, so it does not register with itself
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/

# Fast eviction in development (removes stopped instances promptly)
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000
eureka.server.response-cache-update-interval-ms=3000

# ==========================================
# API Gateway Routing & Load Balancer Settings
# ==========================================
gateway.services.auth-service-id=eCommUserAuth
gateway.loadbalancer.strategy=round-robin
gateway.http.connect-timeout-ms=5000
gateway.http.read-timeout-ms=15000

# ==========================================
# Actuator Management Endpoints
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ==========================================
# Logging Configuration
# ==========================================
logging.level.com.ecomm.gateway=DEBUG
logging.level.org.springframework.cloud=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
